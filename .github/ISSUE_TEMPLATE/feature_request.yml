name: "💡 Mejora / Improvement"
description: "Proponer una mejora realista / Suggest an improvement"
title: "[FEATURE] "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        ## 🇪🇸 Español
        Describe qué necesitas y para qué serviría. Las ideas son bienvenidas, pero SYNCORE es un proyecto personal: no hay garantía de implementación.

        ## 🇬🇧 English
        Describe the goal and the user problem it would solve. Suggestions are welcome, but SYNCORE is a personal project and implementation is not guaranteed.

        [Funciones actuales / Current features](https://github.com/IMC93Labs/Syncore-Releases/blob/main/docs/guides/features.md) · [Ayuda / Support](https://github.com/IMC93Labs/Syncore-Releases/blob/main/SUPPORT.md)
  - type: textarea
    id: improvement
    attributes:
      label: "Propuesta / Proposed improvement"
      description: "¿Qué añadirías o cambiarías? / What would you add or change?"
    validations:
      required: true
  - type: textarea
    id: reason
    attributes:
      label: "Necesidad / User need"
      description: "¿Qué problema resolvería? / What problem would it solve?"
    validations:
      required: true
  - type: textarea
    id: behaviour
    attributes:
      label: "Funcionamiento esperado / Desired behaviour"
  - type: textarea
    id: context
    attributes:
      label: "Ejemplos / Examples"
      description: "Sin datos privados / No personal data."
  - type: checkboxes
    id: checks
    attributes:
      label: "Comprobaciones / Checks"
      options:
        - label: "He buscado propuestas similares / I searched for similar suggestions."
          required: true
        - label: "No he compartido credenciales ni datos privados / I have not shared credentials or private data."
          required: true
