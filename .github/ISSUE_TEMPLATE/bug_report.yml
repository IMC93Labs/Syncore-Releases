name: "🐛 Error / Bug"
description: "Comunicar un error reproducible / Report a reproducible bug"
title: "[BUG] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        ## 🇪🇸 Español
        Gracias por informar del problema. Revisa primero las incidencias existentes y la [última versión](https://github.com/IMC93Labs/Syncore-Releases/releases/latest).

        ## 🇬🇧 English
        Thank you for reporting a bug. First check existing Issues and the [latest release](https://github.com/IMC93Labs/Syncore-Releases/releases/latest).

        **Privacidad / Privacy:** No incluyas correos personales, contraseñas, tokens OAuth, partidas privadas ni rutas sensibles. Do not share personal email, passwords, OAuth tokens, private saves or sensitive paths.

        [Ayuda / Support](https://github.com/IMC93Labs/Syncore-Releases/blob/main/SUPPORT.md) · [Aviso / Disclaimer](https://github.com/IMC93Labs/Syncore-Releases/blob/main/DISCLAIMER.md)
  - type: input
    id: version
    attributes:
      label: "Versión de SYNCORE / SYNCORE version"
      placeholder: "Ej. / e.g. 2.2.1"
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: "Versión de Windows / Windows version"
      placeholder: "Ej. / e.g. Windows 11 24H2"
    validations:
      required: true
  - type: input
    id: game
    attributes:
      label: "Juego afectado, si procede / Affected game, if applicable"
      placeholder: "Ej. / e.g. Red Dead Redemption 2"
  - type: textarea
    id: issue
    attributes:
      label: "¿Qué ocurre? / What happens?"
      description: "Describe el problema / Describe the problem."
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: "Pasos para reproducirlo / Steps to reproduce"
      description: "Indica la secuencia más corta que provoca el error / Provide the shortest sequence reproducing the issue."
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: "Comportamiento esperado / Expected behaviour"
  - type: dropdown
    id: frequency
    attributes:
      label: "Frecuencia / Frequency"
      options:
        - "Siempre / Always"
        - "A veces / Sometimes"
        - "Solo una vez / Once"
        - "No estoy seguro / Not sure"
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: "Más información / Additional context"
      description: "Incluye capturas o registros solo si no revelan datos privados / Include screenshots or logs only if privacy-safe."
  - type: checkboxes
    id: confirmation
    attributes:
      label: "Comprobaciones / Checks"
      options:
        - label: "He buscado problemas similares / I searched for existing reports."
          required: true
        - label: "No he incluido datos personales o secretos / I have not shared personal data or secrets."
          required: true
